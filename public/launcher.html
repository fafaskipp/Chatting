<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>介護日記</title>
  <style>
    /* 果樹園のイメージ：やわらかい草色の地に、くだもの色のボタン（インターネットなしで動くよう、端末の文字だけを使う） */
    :root { --bg: #f4f8ec; --bg-dot: #e3edd2; --ink: #2f3a24; --muted: #6b7760; --card: #fff; --line: #d9e4c8; --accent: #4f8a2b; --accent-dark: #3a6a1e; --radius: 22px; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1f2a17; --bg-dot: #27341d; --ink: #eef5e4; --muted: #b3c2a2; --card: #2b3a20; --line: #425432; } }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background-color: var(--bg);
      font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
      background-image: radial-gradient(var(--bg-dot) 2px, transparent 2px); background-size: 26px 26px;
      padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    }
    button { font: inherit; color: inherit; }
    .wrap { max-width: 980px; margin: 0 auto; }
    .langs { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding-top: 14px; }
    .langs-inner { display: flex; gap: 8px; flex-wrap: wrap; }
    rt { display: none; font-size: .55em; font-weight: 600; }
    .furigana-on rt { display: revert; }
    .furigana-on header p, .furigana-on .unit .name { line-height: 1.9; }
    .langs button {
      min-height: 44px; padding: 6px 14px; border: 2px solid var(--line); border-radius: 999px; background: var(--card);
      font-weight: 800; cursor: pointer; color: var(--ink);
    }
    #btn-furi { border-style: dashed; }
    .langs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    header { text-align: center; padding: 10px 0 18px; }
    header h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: .04em; }
    header h1 .tree { display: inline-block; animation: sway 4s ease-in-out infinite; transform-origin: bottom center; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }
    @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .unit {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      min-height: 170px; padding: 16px 10px 18px; border-radius: var(--radius);
      background: var(--card); border: 3px solid var(--c); color: var(--ink); text-decoration: none;
      box-shadow: 0 6px 0 var(--c); transition: transform .12s ease, box-shadow .12s ease;
    }
    .unit:hover { transform: translateY(-3px); box-shadow: 0 9px 0 var(--c); }
    .unit:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c); }
    .unit:focus-visible, .langs button:focus-visible { outline: 3px solid #f2b705; outline-offset: 3px; }
    .unit svg { width: 78px; height: 78px; transition: transform .2s ease; }
    .unit:hover svg { transform: rotate(-8deg) scale(1.06); }
    .unit .name { font-size: 1.35rem; font-weight: 800; text-align: center; line-height: 1.25; }
    .unit .stat { font-size: .88rem; color: var(--muted); min-height: 1.2em; text-align: center; }
    .unit .badge { display: inline-block; margin-left: 4px; padding: 0 8px; border-radius: 999px; background: #f9a825; color: #000; font-weight: 800; }
    .msg { text-align: center; color: var(--muted); padding: 30px 0; }
    @media (max-width: 820px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .unit { min-height: 140px; }
      .unit svg { width: 62px; height: 62px; }
      .unit .name { font-size: 1.15rem; }
    }
    @media (prefers-reduced-motion: reduce) { header h1 .tree, .unit, .unit svg { animation: none; transition: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="langs"><button type="button" id="btn-furi" aria-pressed="false" data-i18n-aria="btn.furigana" data-i18n-title="btn.furigana">ふりがな</button><span id="langs" class="langs-inner" role="group" aria-label="Language"></span></div>
    <header>
      <h1><span class="tree" aria-hidden="true">🌳</span> <span data-i18n="launcher.title">ユニットをえらんでね</span></h1>
      <p data-i18n="launcher.sub">押すと、そのユニットの介護日記がひらきます</p>
    </header>
    <main><div class="grid" id="units"></div><p class="msg" id="msg" hidden></p></main>
  </div>
  <script src="lang/ja.js"></script>
  <script src="lang/id.js"></script>
  <script src="lang/en.js"></script>
  <script src="i18n.js"></script>
  <script src="launcher.js"></script>
  <script src="furigana.js"></script>
</body>
</html>
