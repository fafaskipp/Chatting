<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>介護日記</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>📒 介護日記</h1>
    <button id="btn-new" class="btn btn-new">＋ 記録を書く</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="date" role="tab"><span class="ic">📅</span><span class="lb">日付で見る</span><span class="lb-s">日付</span></button>
    <button class="tab" data-view="patient" role="tab"><span class="ic">👤</span><span class="lb">利用者で見る</span><span class="lb-s">利用者</span></button>
    <button class="tab" data-view="summary" role="tab"><span class="ic">📊</span><span class="lb">年間まとめ</span><span class="lb-s">まとめ</span></button>
    <button class="tab" data-view="manage" role="tab"><span class="ic">⚙️</span><span class="lb">利用者の管理</span><span class="lb-s">管理</span></button>
    <button class="tab" data-view="trash" role="tab"><span class="ic">🗑</span><span class="lb">ゴミ箱</span><span class="lb-s">ゴミ箱</span></button>
  </nav>

  <main>
    <h2 id="print-title" class="print-only"></h2>

    <!-- 日付で見る -->
    <section id="view-date" class="view">
      <div class="filters">
        <div class="quick">
          <button class="chip-btn active" data-range="today">今日</button>
          <button class="chip-btn" data-range="yesterday">昨日</button>
          <button class="chip-btn" data-range="week">1週間</button>
          <button class="chip-btn" data-range="month">1か月</button>
          <button class="chip-btn" data-range="all">すべて</button>
        </div>
        <label class="check"><input type="checkbox" id="date-important"> ⭐ 重要だけ</label>
        <details id="date-more">
          <summary>🔍 詳しく探す</summary>
          <div class="row">
            <label>日付をえらぶ <input type="date" id="date-pick"></label>
            <label>種類 <select id="date-category"><option value="">すべての種類</option></select></label>
            <label>ことばで探す <input type="search" id="date-search" placeholder="例：転倒、発熱"></label>
          </div>
        </details>
      </div>
      <div class="toolbar">
        <button class="btn btn-print" data-print>🖨 印刷・PDF</button>
        <button class="btn btn-excel" data-export>📊 Excelで保存</button>
      </div>
      <div id="date-list" class="list"></div>
    </section>

    <!-- 利用者で見る -->
    <section id="view-patient" class="view" hidden>
      <div class="filters">
        <label>名前で探す <input type="search" id="patient-search" placeholder="名前 または ふりがな"></label>
        <div id="patient-buttons" class="patient-grid"></div>
      </div>
      <div id="patient-head"></div>
      <div class="toolbar" id="patient-toolbar" hidden>
        <button class="btn btn-print" data-print>🖨 印刷・PDF</button>
        <button class="btn btn-excel" data-export>📊 Excelで保存</button>
      </div>
      <div id="patient-list" class="list"></div>
    </section>

    <!-- 年間まとめ -->
    <section id="view-summary" class="view" hidden>
      <div class="filters">
        <div class="row">
          <label>年 <select id="sum-year"></select></label>
          <label>利用者 <select id="sum-patient"></select></label>
        </div>
      </div>
      <div class="toolbar">
        <button class="btn btn-print" data-print>🖨 印刷・PDF</button>
      </div>
      <div id="sum-body"></div>
    </section>

    <!-- 利用者の管理（枠） -->
    <section id="view-manage" class="view" hidden>
      <p class="hint">利用者は <b id="slot-count">10</b> 人まで登録できます。退所・ご逝去のときは「🗑 削除」を押すと、その枠が「空き」になり、新しい方を登録できます。<br>削除した方の記録はゴミ箱に残り、あとから元に戻せます。</p>
      <div id="slot-list" class="slot-grid"></div>
      <div id="server-info" class="info"></div>
    </section>

    <!-- ゴミ箱 -->
    <section id="view-trash" class="view" hidden>
      <p class="hint">消したものはここに入ります。「↩️ 元に戻す」で戻せます。<br>ゴミ箱の中身は <b><span id="trash-days">30</span>日後に自動で完全に消えます</b>。</p>
      <div id="trash-body"></div>
    </section>
  </main>

  <!-- 記録の入力画面 -->
  <dialog id="note-dialog">
    <form id="note-form" class="form" method="dialog">
      <h2 id="nform-title" tabindex="-1" autofocus>記録を書く</h2>
      <input type="hidden" name="id">
      <div class="row">
        <label>日付<input type="date" name="date" required></label>
        <label>時刻<input type="time" name="time"></label>
      </div>

      <fieldset>
        <legend>だれの記録？</legend>
        <div id="nform-patients" class="choice-grid"></div>
      </fieldset>

      <fieldset>
        <legend>種類（えらぶ か 自由に書く）</legend>
        <input name="category" maxlength="30" placeholder="例：食事、服薬、転倒、受診 など">
        <div id="nform-categories" class="cat-chips"></div>
      </fieldset>

      <label>内容<textarea name="text" rows="6" placeholder="ここに書いてください"></textarea></label>

      <div class="media-input">
        <label class="btn btn-media">📷 写真を追加
          <input type="file" id="nform-files" accept="image/*,video/*" multiple hidden>
        </label>
        <small class="muted">短い動画（100MBまで）も追加できます。写真は自動で小さくして保存します。</small>
        <div id="nform-media" class="media-grid"></div>
        <div id="nform-progress" class="progress" hidden></div>
      </div>

      <div class="row">
        <label>記入者<input name="author" maxlength="30" placeholder="あなたの名前"></label>
        <label class="check big"><input type="checkbox" name="important"> ⭐ 重要（申し送り）</label>
      </div>

      <p id="nform-error" class="error" hidden></p>
      <div class="actions">
        <button type="submit" class="btn btn-save" id="nform-save">💾 保存する</button>
        <button type="button" class="btn btn-gray" id="nform-cancel">やめる</button>
      </div>
    </form>
  </dialog>

  <!-- 利用者の登録・編集 -->
  <dialog id="patient-dialog">
    <form id="patient-form" class="form" method="dialog">
      <h2 id="pform-title" tabindex="-1" autofocus>利用者を登録する</h2>
      <input type="hidden" name="id">
      <input type="hidden" name="slot">
      <label>名前（必須）<input name="name" required maxlength="50" placeholder="例：山田 花子"></label>
      <label>ふりがな<input name="kana" maxlength="50" placeholder="例：やまだ はなこ"></label>
      <label>部屋番号<input name="room" maxlength="20" placeholder="例：101"></label>
      <label>メモ（注意点など）<textarea name="memo" rows="3" maxlength="1000" placeholder="例：アレルギー：卵"></textarea></label>
      <p id="pform-error" class="error" hidden></p>
      <div class="actions">
        <button type="submit" class="btn btn-save">💾 保存する</button>
        <button type="button" id="pform-cancel" class="btn btn-gray">やめる</button>
      </div>
    </form>
  </dialog>

  <!-- 写真・動画の拡大表示 -->
  <dialog id="viewer" class="viewer">
    <div id="viewer-body"></div>
    <button class="btn btn-gray" id="viewer-close">✕ 閉じる</button>
  </dialog>

  <!-- 確認 -->
  <dialog id="confirm-dialog" class="confirm">
    <form method="dialog" class="form">
      <p id="confirm-text" class="confirm-text"></p>
      <div class="actions">
        <button value="yes" class="btn btn-del">はい</button>
        <button value="no" class="btn btn-gray">いいえ</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
