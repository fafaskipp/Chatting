<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>介護日記</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <div class="wrap">
    <div class="langs"><span id="langs" class="langs-inner" role="group" aria-label="Language"></span></div>
    <header>
      <h1>📒 <span data-i18n="app.name">介護日記</span></h1>
      <p id="lead" data-i18n="login.pick">あなたのアカウントを えらんでください</p>
    </header>
    <main>
      <div id="pick"></div>
      <form id="form" class="card login-box" hidden autocomplete="off">
        <div id="chosen"></div>
        <label class="f"><span data-i18n="login.password">パスワード</span>
          <input type="password" id="password" name="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
        </label>
        <p class="error" id="error" role="alert" hidden></p>
        <div class="form-actions">
          <button type="submit" class="btn" style="flex:1" data-i18n="login.submit">ログイン</button>
          <button type="button" class="btn sub" id="back" data-i18n="login.back">← えらびなおす</button>
        </div>
      </form>
      <p class="msg" id="msg" hidden></p>
    </main>
  </div>
  <script src="lang/ja.js"></script>
  <script src="lang/id.js"></script>
  <script src="lang/en.js"></script>
  <script src="i18n.js"></script>
  <script src="home-common.js"></script>
  <script src="login.js"></script>
</body>
</html>
