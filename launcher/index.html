<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ユニットえらび</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
  <style>
    /* 果樹園のイメージ：やわらかい草色の地に、くだもの色のボタン */
    :root {
      --bg: #f4f8ec;
      --bg-dot: #e3edd2;
      --ink: #2f3a24;
      --muted: #6b7760;
      --card: #ffffff;
      --line: #d9e4c8;
      --accent: #4f8a2b;
      --accent-dark: #3a6a1e;
      --radius: 22px;
      --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background-color: var(--bg);
      background-image: radial-gradient(var(--bg-dot) 2px, transparent 2px);
      background-size: 26px 26px;
      padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    }
    button, input, textarea { font: inherit; color: inherit; }
    .wrap { max-width: 980px; margin: 0 auto; }

    header { text-align: center; padding: 22px 0 12px; }
    header h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 800; letter-spacing: .04em; }
    header h1 .tree { display: inline-block; animation: sway 4s ease-in-out infinite; transform-origin: bottom center; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }
    @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

    /* タブ */
    .tabs {
      display: flex; gap: 6px; padding: 6px; margin: 8px auto 20px; max-width: 460px;
      background: var(--card); border: 2px solid var(--line); border-radius: 999px;
    }
    .tab {
      flex: 1; min-height: 52px; border: none; border-radius: 999px; background: transparent;
      font-size: 1.1rem; font-weight: 800; color: var(--muted); cursor: pointer;
    }
    .tab[aria-selected="true"] { background: var(--accent); color: #fff; box-shadow: 0 3px 0 var(--accent-dark); }
    .tab:focus-visible, .unit:focus-visible, .btn:focus-visible, input:focus-visible { outline: 3px solid #f2b705; outline-offset: 3px; }

    /* ユニットのボタン */
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .unit {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      min-height: 170px; padding: 16px 10px 18px; border-radius: var(--radius);
      background: var(--card); border: 3px solid var(--c); color: var(--ink); text-decoration: none;
      box-shadow: 0 6px 0 var(--c); cursor: pointer; transition: transform .12s ease, box-shadow .12s ease;
    }
    .unit:hover { transform: translateY(-3px); box-shadow: 0 9px 0 var(--c); }
    .unit:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c); }
    .unit svg { width: 78px; height: 78px; transition: transform .2s ease; }
    .unit:hover svg { transform: rotate(-8deg) scale(1.06); }
    .unit .name { font-size: 1.35rem; font-weight: 800; text-align: center; line-height: 1.25; }
    .unit .hint { font-size: .85rem; color: var(--muted); }
    .unit.unset { border-style: dashed; box-shadow: none; background: rgba(255, 255, 255, .7); }
    .unit.unset svg { filter: grayscale(.7); opacity: .6; }

    /* リンクの設定 */
    .card { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 18px; }
    .card + .card { margin-top: 16px; }
    .card h2 { margin: 0 0 4px; font-size: 1.25rem; }
    .card .lead { margin: 0 0 14px; color: var(--muted); }
    .row {
      display: grid; grid-template-columns: 52px minmax(0, 9em) minmax(0, 1fr) auto; gap: 10px; align-items: center;
      padding: 10px 0; border-top: 2px dashed var(--line);
    }
    .row:first-of-type { border-top: none; }
    .row svg { width: 48px; height: 48px; }
    .row label { font-weight: 800; font-size: 1.1rem; }
    .row input {
      width: 100%; min-height: 50px; padding: 8px 14px; border: 2px solid var(--line); border-radius: 14px; background: #fbfdf7;
      font-size: 1rem;
    }
    .row input:focus { border-color: var(--accent); background: #fff; }
    .btn {
      min-height: 50px; padding: 8px 18px; border: none; border-radius: 14px; font-weight: 800; font-size: 1rem; cursor: pointer;
      background: var(--accent); color: #fff; box-shadow: 0 3px 0 var(--accent-dark);
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }
    .btn.sub { background: #eef3e4; color: var(--ink); box-shadow: 0 3px 0 var(--line); }
    .btn:disabled { opacity: .45; cursor: default; }
    .share { display: flex; flex-direction: column; gap: 10px; }
    .share textarea {
      width: 100%; min-height: 90px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px;
      font-family: ui-monospace, Consolas, monospace; font-size: .85rem; background: #fbfdf7; resize: vertical;
    }
    .share .actions { display: flex; flex-wrap: wrap; gap: 10px; }

    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 800; z-index: 10;
    }

    @media (max-width: 820px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .unit { min-height: 140px; }
      .unit svg { width: 62px; height: 62px; }
      .unit .name { font-size: 1.15rem; }
      .row { grid-template-columns: 44px minmax(0, 1fr) auto; }
      .row svg { width: 40px; height: 40px; }
      .row input { grid-column: 1 / -1; grid-row: 2; }
    }
    @media (prefers-reduced-motion: reduce) {
      header h1 .tree, .unit, .unit svg { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span class="tree" aria-hidden="true">🌳</span> ユニットをえらんでね</h1>
      <p>押すと、そのユニットの介護日記がひらきます</p>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-open" aria-controls="panel-open" aria-selected="true">🍎 ひらく</button>
      <button class="tab" role="tab" id="tab-links" aria-controls="panel-links" aria-selected="false">⚙️ リンク設定</button>
    </nav>

    <main>
      <section id="panel-open" role="tabpanel" aria-labelledby="tab-open">
        <div class="grid" id="units"></div>
      </section>

      <section id="panel-links" role="tabpanel" aria-labelledby="tab-links" hidden>
        <div class="card">
          <h2>🔗 それぞれのユニットのアドレス</h2>
          <p class="lead">介護日記のパソコンの黒い画面に出ているアドレスを入れてください。例：http://192.168.1.10:3000　入れると自動で保存されます。</p>
          <div id="rows"></div>
        </div>
        <div class="card share">
          <h2>📲 ほかの端末にも同じ設定を入れる</h2>
          <p class="lead">リンクの設定はこの端末だけに保存されます。下のコードをコピーして、ほかの端末のこの画面に貼り付けて「読みこむ」を押すと、同じ設定になります。</p>
          <textarea id="share-code" aria-label="設定のコード" spellcheck="false"></textarea>
          <div class="actions">
            <button type="button" class="btn sub" id="copy-code">📋 コードをコピー</button>
            <button type="button" class="btn" id="load-code">📥 貼り付けたコードを読みこむ</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script>
    'use strict';

    // ユニット（名前・くだものの色・形）。最初から入れておきたいアドレスは url に書くと、全部の端末で使われます。
    const UNITS = [
      { id: 'momo', name: 'モモの木', color: '#f28aa6', shape: 'peach', url: '' },
      { id: 'ume', name: 'うめの木', color: '#9ccc3c', shape: 'round', url: '' },
      { id: 'kaki', name: 'かきの木', color: '#f08a24', shape: 'persimmon', url: '' },
      { id: 'biwa', name: 'びわの木', color: '#f5b335', shape: 'oval', url: '' },
      { id: 'nashi', name: 'なしの木', color: '#c9c25a', shape: 'pear', url: '' },
      { id: 'yuzu', name: 'ゆずの木', color: '#f2cf1d', shape: 'round', url: '' },
      { id: 'mikan', name: 'みかん', color: '#fb8c00', shape: 'flat', url: '' },
      { id: 'ringo', name: 'りんご', color: '#e53935', shape: 'apple', url: '' },
    ];
    const KEY = 'unit-launcher-links-v1';

    const $ = (s) => document.querySelector(s);

    // くだもののイラスト（色と形だけ変える）
    function fruitSvg(u) {
      const body = {
        peach: '<path d="M50 30 C24 28 16 58 30 76 C38 86 50 88 50 88 C50 88 62 86 70 76 C84 58 76 28 50 30 Z"/><path d="M50 32 C44 50 46 70 50 86" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="3"/>',
        round: '<circle cx="50" cy="60" r="27"/>',
        persimmon: '<ellipse cx="50" cy="62" rx="31" ry="25"/><path d="M50 38 l-14 -2 8 8 -10 6 13 -1 3 10 3 -10 13 1 -10 -6 8 -8 Z" fill="#5b8c2a"/>',
        oval: '<ellipse cx="50" cy="61" rx="22" ry="27"/>',
        pear: '<path d="M50 30 C40 30 38 44 36 52 C24 60 26 88 50 88 C74 88 76 60 64 52 C62 44 60 30 50 30 Z"/>',
        flat: '<ellipse cx="50" cy="62" rx="31" ry="24"/><circle cx="50" cy="40" r="3" fill="#5b8c2a"/>',
        apple: '<path d="M50 40 C38 30 18 36 20 58 C22 78 38 90 50 84 C62 90 78 78 80 58 C82 36 62 30 50 40 Z"/>',
      }[u.shape];
      return `<svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 38 C50 30 52 24 56 18" fill="none" stroke="#7a5230" stroke-width="4" stroke-linecap="round"/>
        <path d="M54 24 C64 12 80 14 82 18 C76 28 62 30 54 24 Z" fill="#6aa832"/>
        <g fill="${u.color}">${body}</g>
        <ellipse cx="39" cy="54" rx="6" ry="9" fill="#fff" opacity=".45" transform="rotate(-20 39 54)"/>
      </svg>`;
    }

    function load() {
      try {
        return JSON.parse(localStorage.getItem(KEY)) || {};
      } catch {
        return {};
      }
    }
    let links = load();

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(links));
      } catch {
        toast('この端末では保存できませんでした');
      }
    }

    // 「192.168.1.10:3000」のように http:// を書き忘れても開けるようにする
    function normalize(url) {
      const v = String(url || '').trim();
      if (!v) return '';
      return /^[a-z][a-z0-9+.-]*:\/\//i.test(v) ? v : 'http://' + v;
    }

    const urlOf = (u) => normalize(links[u.id] || u.url);

    function toast(msg) {
      const t = $('#toast');
      t.textContent = msg;
      t.hidden = false;
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => (t.hidden = true), 2200);
    }

    function renderUnits() {
      $('#units').innerHTML = UNITS.map((u) => {
        const url = urlOf(u);
        return url
          ? `<a class="unit" style="--c:${u.color}" href="${encodeURI(url)}" target="_blank" rel="noopener">
              ${fruitSvg(u)}<span class="name">${u.name}</span></a>`
          : `<button type="button" class="unit unset" style="--c:${u.color}" data-setup="${u.id}">
              ${fruitSvg(u)}<span class="name">${u.name}</span><span class="hint">リンクを入れてね</span></button>`;
      }).join('');
    }

    function renderRows() {
      $('#rows').innerHTML = UNITS.map((u) => `
        <div class="row">
          ${fruitSvg(u)}
          <label for="url-${u.id}">${u.name}</label>
          <input id="url-${u.id}" type="url" inputmode="url" autocomplete="off" spellcheck="false"
                 placeholder="http://192.168.1.10:3000" value="${(links[u.id] || u.url).replace(/"/g, '&quot;')}" data-unit="${u.id}">
          <button type="button" class="btn sub" data-test="${u.id}" ${urlOf(u) ? '' : 'disabled'}>ためす</button>
        </div>`).join('');
      updateShareCode();
    }

    function updateShareCode() {
      $('#share-code').value = JSON.stringify(Object.fromEntries(UNITS.map((u) => [u.id, links[u.id] || u.url || ''])));
    }

    function showTab(name) {
      for (const t of ['open', 'links']) {
        $('#tab-' + t).setAttribute('aria-selected', String(t === name));
        $('#panel-' + t).hidden = t !== name;
      }
      if (name === 'open') renderUnits();
    }

    $('#tab-open').addEventListener('click', () => showTab('open'));
    $('#tab-links').addEventListener('click', () => showTab('links'));

    // リンクがまだのユニットを押したら、設定のところへ
    $('#units').addEventListener('click', (e) => {
      const b = e.target.closest('[data-setup]');
      if (!b) return;
      showTab('links');
      const input = $('#url-' + b.dataset.setup);
      input.scrollIntoView({ behavior: 'smooth', block: 'center' });
      input.focus();
    });

    let saveTimer;
    $('#rows').addEventListener('input', (e) => {
      const id = e.target.dataset.unit;
      if (!id) return;
      links[id] = e.target.value.trim();
      $(`[data-test="${id}"]`).disabled = !normalize(links[id]);
      updateShareCode();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        save();
        toast('保存しました ✅');
      }, 600);
    });

    $('#rows').addEventListener('click', (e) => {
      const b = e.target.closest('[data-test]');
      if (!b) return;
      const u = UNITS.find((x) => x.id === b.dataset.test);
      const url = urlOf(u);
      if (url) window.open(url, '_blank', 'noopener');
    });

    $('#copy-code').addEventListener('click', async () => {
      const box = $('#share-code');
      try {
        await navigator.clipboard.writeText(box.value);
        toast('コピーしました 📋');
      } catch {
        box.select();
        toast('選ばれた文字を長押しして「コピー」してください');
      }
    });

    $('#load-code').addEventListener('click', () => {
      try {
        const data = JSON.parse($('#share-code').value);
        if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error();
        for (const u of UNITS) if (typeof data[u.id] === 'string') links[u.id] = data[u.id].trim();
        save();
        renderRows();
        toast('読みこみました ✅');
      } catch {
        toast('コードが正しくありません。もう一度コピーしてください');
      }
    });

    renderUnits();
    renderRows();
  </script>
</body>
</html>
